name: rpmlint
on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  rpmlint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shogo82148/actions-rpmlint@v0.2.5
        with:
          rpmlint_flags: "yum.repos/mackerel/rpmbuild/SPECS/mackerel.spec yum.repos/shogo82148/rpmbuild/SPECS/shogo82148.spec"
