name: rpmlint
on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  rpmlint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-rpmlint@628f7d2f7d79984a7ff85fcbdf642d6ff08ea512 # v0.2.4
        with:
          rpmlint_flags: "yum.repos/mackerel/rpmbuild/SPECS/mackerel.spec yum.repos/shogo82148/rpmbuild/SPECS/shogo82148.spec"
